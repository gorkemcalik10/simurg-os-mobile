<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simurg Performance UI Visual QA</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 30% 0,rgba(41,229,140,.07),transparent 30%),#05080d;color:#f4f8fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:12px 12px 90px}#training-lab{display:block;max-width:100%;margin:auto}.visualNav{position:fixed;z-index:4;left:10px;right:10px;bottom:8px;height:66px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:7px;border:1px solid rgba(255,255,255,.1);border-radius:26px;background:rgba(12,17,24,.94);box-shadow:0 18px 50px rgba(0,0,0,.5)}.visualNav span{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:19px;color:#8290a2;font-size:10px;font-weight:850}.visualNav span:nth-child(4){background:rgba(41,229,140,.13);color:#29e58c}.visualNav i{font-style:normal;font-size:18px}
    @media(min-width:901px){body{padding:28px}.visualNav{display:none}}
  </style>
  <link rel="stylesheet" href="../../simurg-performance-ui.css">
  <link rel="stylesheet" href="../../simurg-mobile-system.css?v=5">
</head>
<body>
  <section id="training-lab" class="active"></section>
  <nav class="visualNav"><span><i>🏠</i>Ana</span><span><i>🏋️</i>Gym</span><span><i>📋</i>Günlük</span><span><i>◫</i>Performans</span><span><i>☰</i>Menü</span></nav>
  <script src="../../simurg-sleep-intelligence.js"></script>
  <script src="../../simurg-performance-engine.js"></script>
  <script>
    function addDays(value,amount){var date=new Date(value+'T12:00:00Z');date.setUTCDate(date.getUTCDate()+amount);return date.toISOString().slice(0,10)}
    function sleepRow(date){return {date:date,startTime:addDays(date,-1)+'T23:00:00Z',endTime:date+'T07:00:00Z',deepSleep:90*60,remSleep:90*60,lightSleep:270*60,sleepGoal:8*60*60}}
    function workout(date,id,raw){return {date:date,sessionId:id,exerciseId:id+'-exercise',exercise:'Squat',programKey:'strength-a',sets:4,reps:8,rpe:raw/60,durationMinutes:60,startTime:'18:00'}}
    var selectedDate='2026-08-21',DATA={polarSleep:{daily:{}},polarNightlyRecharge:{daily:{}}};
    for(var offset=-20;offset<=0;offset+=1){var day=addDays(selectedDate,offset);DATA.polarSleep.daily[day]=sleepRow(day);DATA.polarNightlyRecharge.daily[day]={date:day,ansCharge:offset===0?1:3,ansChargeStatus:'GOOD',nightlyRechargeStatus:'GOOD',heartRateVariabilityAvg:61,heartRateAvg:52}}
    var scenario=new URLSearchParams(location.search).get('scenario')||'rest';
    if(scenario==='balance'||scenario==='insufficient'){
      DATA.workouts=[];
      if(scenario==='balance')[100,120,140,160,180,200,220,260,280,300].forEach(function(raw,index){DATA.workouts.push(workout(addDays(selectedDate,index-10),'gym-'+index,raw))});
      DATA.workouts.push(workout(selectedDate,'current',240));
    }
  </script>
  <script src="../../simurg-performance-ui.js"></script>
  <script>SimurgPerformanceUI.setDate(selectedDate);SimurgPerformanceUI.render()</script>
</body>
</html>
