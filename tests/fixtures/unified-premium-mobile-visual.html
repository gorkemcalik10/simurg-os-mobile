<!doctype html>
<html lang="tr">
<head>

  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05080c;color:#f2f4f6;font-family:Inter,system-ui,sans-serif}body{overflow-x:hidden}
    main{width:100%;max-width:430px;margin:0 auto;padding:12px 12px 100px}.section{display:block!important;width:100%;min-width:0}.topbar{margin-bottom:10px}.topbar h1{margin:0}.gp-card,.group,.panel{border:1px solid rgba(166,180,194,.13);background:#0b1219}.fixture-stack{display:grid;gap:10px}.gp-card-head{display:flex;justify-content:space-between;align-items:center}.gp-card-head h2{margin:0;font-size:15px}.gp-card-head span{color:#687582;font-size:9px}#home .gp-home-pane.active{display:grid!important;gap:10px}.gp-daily-guidance{display:grid;grid-template-columns:1fr 120px;gap:10px}.gp-guidance-action h2{margin:4px 0;font-size:16px}.gp-guidance-action p,.gp-guidance-sleep span{margin:0;color:#8d98a4;font-size:10px;line-height:1.4}.gp-guidance-sleep{border-left:1px solid rgba(166,180,194,.13);padding-left:10px}.gp-guidance-sleep small,.gp-guidance-sleep b{display:block;font-size:9px}.gp-energy-card,.gp-workout-summary{padding:13px;border-radius:18px}.gp-energy-card h2,.gp-workout-summary h3{margin:0 0 5px}.gp-energy-card p,.gp-workout-summary p{margin:0;color:#8d98a4;font-size:10px}.layout{display:flex;flex-direction:column}.right{display:grid;gap:8px}.panel{padding:11px;border-radius:18px}.bottomStats{display:grid;grid-template-columns:repeat(3,1fr)}.stat{text-align:center}.weekStrip{display:flex;gap:6px;overflow-x:auto}.dateBtn{color:#f2f4f6}.exerciseGrid{display:grid}.setTable{border-collapse:collapse}.setTable th,.setTable td{text-align:center;border-bottom:1px solid rgba(166,180,194,.1)}.emptyState{padding:20px;border:1px dashed rgba(166,180,194,.2);border-radius:18px;color:#8d98a4}.mwShell{width:100%}#simurgV8Nav{position:fixed;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);left:8px;right:8px;bottom:8px}#simurgV8Nav button{display:grid;place-items:center;border:0;background:transparent;color:#7f8995}#simurgV8Nav button i{display:block}
  </style>
</head>
<body><main id="fixture"></main><nav id="simurgV8Nav" class="ps-key-home"><button data-key="home" class="active"><i>⌂</i>Ana</button><button data-key="gym"><i>□</i>Gym</button><button data-key="logger"><i>≡</i>Günlük</button><button data-key="training-lab"><i>⌁</i>Performans</button><button data-key="menu"><i>•••</i>Menü</button></nav>
<script>
  const query=new URLSearchParams(location.search),screen=query.get('screen')||'home';
  const dates=['03.09.26','04.09.26','05.09.26','06.09.26'];
  const dateStrip='<div class="weekStrip">'+dates.map((d,i)=>'<button class="dateBtn '+(i===0?'active':'')+'"><div class="d">'+d+'</div><div class="day">'+['Perşembe','Cuma','Cumartesi','Pazar'][i]+'</div></button>').join('')+'</div>';
  const exercise=(name,open=false)=>'<div class="exerciseCard '+(open?'isJournalOpen':'')+'"><button class="mjExerciseToggle" aria-expanded="'+open+'"><span class="mjExerciseIdentity"><b>'+name+'</b><small>Toplam ağırlık · Hacim ×2</small></span><span class="mjExerciseNumbers"><strong>4 set</strong><em>36 tekrar</em></span><i class="mjExerciseChevron">›</i></button><div class="mjExerciseBody"><div class="exTop"><div class="exerciseIdentity"><div class="exName">'+name+'</div><span class="loadProfileTag">Toplam ağırlık</span></div></div><table class="setTable"><thead><tr><th>SET</th><th>TEKRAR</th><th>KİLO</th></tr></thead><tbody><tr><td>1</td><td>10</td><td>80</td></tr><tr><td>2</td><td>10</td><td>82,5</td></tr><tr><td>3</td><td>8</td><td>85</td></tr><tr><td>4</td><td>8</td><td>85</td></tr></tbody></table></div></div>';
  const home='<section id="home" class="section active gp-home"><div class="gp-home-pane active"><section class="sci-home-insight good"><small>KOÇ KARARI</small><b>Planı koru</b><em>Form ve hedef RPE öncelikli.</em></section><section class="gp-card gp-daily-guidance"><div class="gp-guidance-action"><small>GÜNLÜK YÖNLENDİRME</small><h2>Planı koru</h2><p>Form kalitesini ve hedef RPE aralığını koruyarak ilerle.</p></div><div class="gp-guidance-sleep"><small>UYKU DESTEĞİ</small><b>Uyku hedefin dengeli.</b><span>Gerçek uyku · 7sa 24dk</span></div></section><section class="gp-card gp-daily-evidence"><div class="gp-card-head"><h2>Günlük Kanıtlar</h2><span>Bugün</span></div><div class="gp-evidence-strip"><button class="gp-evidence-item sleep"><small>Uyku</small><b>82<em>/100</em></b><span>Uyku skoru</span></button><button class="gp-evidence-item hrv"><small>HRV</small><b>63<em>ms</em></b><span>Gece ortalaması</span></button><button class="gp-evidence-item heart"><small>Gece Nabzı</small><b>51<em>bpm</em></b><span>Polar gece verisi</span></button><button class="gp-evidence-item load"><small>Cardio Load</small><b>42</b><span>Dengeli</span></button></div><p class="gp-polar-context"><b>Polar</b><span>ANS Charge kişisel aralıkta.</span></p></section><section class="gp-energy-card"><h2>Energy · 78</h2><p>Uyku, recovery ve yük sinyalleri bugünkü planı destekliyor.</p></section><section class="gp-workout-summary"><h3>Upper Strength</h3><p>4 egzersiz · Gym’de düzenlenir.</p></section></div></section>';
  const daily='<section id="workout" class="section active gp-logger-refined miaJournalDashboard"><div class="topbar"><div class="title"><h1>Antrenman Günlüğü</h1></div></div>'+dateStrip+'<div class="layout"><div><div class="bottomStats"><div class="stat">SET<br><b>12</b></div><div class="stat">TEKRAR<br><b>104</b></div><div class="stat">HACİM<br><b>8.640</b></div></div><div id="workoutGroups"><div class="group"><div class="groupHead"><div><span class="groupTitle">GÖĞÜS</span><span class="groupMeta">6.420 kg hacim</span></div><div class="groupPill">8 set</div></div><div class="exerciseGrid">'+exercise('Incline Dumbbell Bench Press — Kontrollü Eksantrik',true)+exercise('Cable Fly')+'</div></div></div></div><div class="right"><div class="panel"><h3>Kas grubu dağılımı</h3></div></div></div></section>';
  const empty='<section id="workout" class="section active gp-logger-refined miaJournalDashboard miaJournalEmpty"><div class="topbar"><h1>Antrenman Günlüğü</h1></div>'+dateStrip+'<div class="layout"><div><div id="workoutGroups"><div class="emptyState"><b>03.09.26 için kayıt yok.</b><br>Bu gün dinlenme veya boş gün olarak kalıyor.</div></div></div><div class="right"><div class="panel miaCompactEmpty"><h3>Performans özeti</h3><p class="miaJournalEmptyNote">Seçili gün için performans özeti yok.</p></div></div></div></section>';
  function weekly(completed){const status=completed?'Tamamlanmış hafta · önceki tamamlanmış hafta':'Hafta devam ediyor — haftalık karşılaştırma Pazar sonunda tamamlanacak.';return '<section id="weekly" class="section active mwMobileWeekly"><div id="weeklyReport"><div class="mwShell"><header class="mwHeader"><div><small>'+(completed?'GEÇMİŞ HAFTA':'BU HAFTA')+'</small><h1>Haftalık Özet</h1></div><div class="mwWeekNav"><button>‹</button><strong>31 Ağu – 6 Eyl 2026</strong><button '+(completed?'':'disabled')+'>›</button></div></header><section class="mwHero"><small>BU HAFTANIN ÖZETİ</small><h2>'+(completed?'Hafta tamamlandı':'Hafta ilerliyor')+'</h2><p>'+(completed?'Gym hacmin geçen haftaya göre %8 arttı.':'Şu ana kadar 3 antrenman günü ve 3 seans kaydedildi.')+'</p><span class="mwHeroStatus '+(completed?'':'active')+'">'+status+'</span></section><section class="mwPrimaryGrid"><article class="mwPrimary days current"><small>Antrenman günü</small><strong>3</strong><span>3 seans</span></article><article class="mwPrimary duration current"><small>Toplam süre</small><strong>2sa 35dk</strong><span>3/3 seans</span></article><article class="mwPrimary volume current"><small>Gym hacmi</small><strong>18,4</strong><span>ton · 3 Gym</span></article></section><section class="mwRhythm"><header><div><small>7 GÜNLÜK RİTİM</small><h2>Antrenman ve yük</h2></div><span>Mevcut günlük kayıtlar</span></header><div class="mwRhythmPlot">'+['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map((d,i)=>'<div class="mwRhythmDay '+(i===0||i===2||i===4?'training':i>4&&!completed?'missing':'neutral')+'"><div><i style="height:'+(i===0?65:i===2?90:i===4?48:8)+'%"></i></div><b>'+d+'</b><span>'+(31+i)+'</span></div>').join('')+'</div></section><section class="mwSection"><header><small>KUVVET</small><h2>Kuvvet özeti</h2></header><div class="mwMetricGrid"><article class="mwMetric"><small>Toplam set</small><b>42</b></article><article class="mwMetric"><small>Ort. seans RPE</small><b>7,6</b></article></div></section><section class="mwSection"><header><small>POLAR</small><h2>Haftalık vücut sinyalleri</h2></header><div class="mwMetricGrid"><article class="mwMetric"><small>HRV</small><b>62 <i>ms</i></b><em>5 gece</em></article><article class="mwMetric"><small>Gerçek uyku</small><b>7sa 18dk</b><em>5 gece</em></article></div></section></div></div></section>'}
  document.getElementById('fixture').innerHTML=screen==='daily'?daily:screen==='empty'?empty:screen==='weekly-active'?weekly(false):screen==='weekly-complete'?weekly(true):home;
</script></body></html>
